name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Windows 发版 job：行为与原单 job 版本一致（产物 workbench.exe）。
  # Linux 与 Windows 两 job 并行上传各自资产：action-gh-release 对已存在 Release 为
  # 追加语义（后完成的一方复用先完成一方创建的 Release，仅补传 files），两端最终态一致。
  release-windows:
    runs-on: windows-latest

    steps:
      # 1. 检出代码（获取完整历史，用于生成 Release Notes）
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 安装 Go 1.26（对齐 ci.yml 与 go.mod toolchain go1.26.6）
      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      # 3. 安装 Node.js 20（带 npm cache 加速）
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # 4. 安装前端依赖
      - name: 安装前端依赖
        run: cd frontend && npm ci

      # 5. 安装 Wails CLI（锁定 v2 大版本）
      - name: 安装 Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2

      # 6. 构建 Wails 应用（注入版本号和构建时间）
      - name: 构建应用
        run: |
          $VER = "${{ github.ref_name }}".TrimStart('v')
          $BT = Get-Date -Format "yyyyMMdd-HHmmss"
          wails build -ldflags "-X main.version=$VER -X main.buildTime=$BT"

      # 7. 验证构建产物
      - name: 验证构建产物
        run: |
          if (Test-Path "build/bin/workbench.exe") {
            Write-Host "构建成功: build/bin/workbench.exe"
            ./build/bin/workbench.exe --version
          } else {
            Write-Error "构建失败: workbench.exe 未生成"
            exit 1
          }

      # 8. 创建 GitHub Release 并上传 exe（name/generate_release_notes 由本 job 负责）
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: build/bin/workbench.exe

  # Linux 发版 job（runner 锁 ubuntu-22.04：glibc 基线低，产物向后兼容 Ubuntu 22.04+/Debian 12+；
  # libwebkit2gtk-4.1-dev 在 22.04 仓库可用，已对 archive.ubuntu.com 档案池复核）
  release-linux:
    runs-on: ubuntu-22.04

    steps:
      # 1. 检出代码（本 job 不生成 Release Notes，无需完整历史）
      - name: 检出代码
        uses: actions/checkout@v4

      # 2. 安装 Go 1.26（对齐 ci.yml 与 go.mod toolchain go1.26.6）
      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      # 3. 安装 Node.js 20（带 npm cache 加速）
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # 4. 安装 Wails Linux 桌面编译依赖（对齐 ci.yml：gcc/pkg-config 支撑 cgo，
      #    libgtk-3-dev / libwebkit2gtk-4.1-dev 提供对应 pkg-config 包）
      - name: 安装 Wails Linux 桌面编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      # 5. 安装前端依赖（对齐 Windows job：显式 npm ci 按 lockfile 确定性安装，
      #    避免 wails build 内部 npm install 的 lock 漂移）
      - name: 安装前端依赖
        run: cd frontend && npm ci

      # 6. 安装 Wails CLI（锁定 v2 大版本）
      - name: 安装 Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2

      # 7. 构建 Wails 应用（注入版本号和构建时间，对齐 Windows job 的 ldflags；
      #    webkit2_41 标签把 pkg-config 依赖从默认 webkit2gtk-4.0 切到 4.1，
      #    Ubuntu 22.04+/Debian 12+ 仓库仅提供 4.1，与 ci.yml 编译验证口径一致）
      - name: 构建应用
        run: |
          VER="${GITHUB_REF_NAME#v}"
          BT=$(date +%Y%m%d-%H%M%S)
          wails build -tags webkit2_41 -ldflags "-X main.version=$VER -X main.buildTime=$BT"

      # 8. 验证构建产物（--version 打印后退出，无 GUI 依赖）
      - name: 验证构建产物
        run: |
          if [ -f build/bin/workbench ]; then
            echo "构建成功: build/bin/workbench"
            ./build/bin/workbench --version
          else
            echo "构建失败: workbench 未生成"
            exit 1
          fi

      # 9. 打包 tar.gz（扁平布局：二进制 + 依赖说明，解压即用；资产名与
      #    service/update.go 的 updateAssetLinux 严格一致，自更新按名匹配下载）
      - name: 打包 Linux 产物
        run: |
          cp build/README-linux.md build/bin/README-linux.md
          tar -czf workbench-linux-amd64.tar.gz -C build/bin workbench README-linux.md

      # 10. 上传 Release 资产（Release 元数据由 release-windows job 负责，本 job 仅追加文件）
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: workbench-linux-amd64.tar.gz
