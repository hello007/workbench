# CI：push(master) / pull_request 触发，Linux runner 跑后端编译验证/静态检查/单测/集成测试 + 前端构建/单测 + Playwright E2E。
# 与 release.yml（tag v* 触发、windows-latest + ubuntu-22.04 容器（webkit2_41 构建，glibc 2.35 基线）
# 双 job 发版，产出 workbench.exe 与 workbench-linux-amd64.tar.gz）互不冲突：tag push 不匹配 branches 过滤器。
# 前置事实（Linux 平台相关，改动步骤前先读）：
# 1. frontend/wailsjs/ 与 frontend/dist/ 均在 .gitignore 中不入库。wailsjs 缺失会使 vite build
#    失败，须先 wails generate module 重新生成绑定；而 main.go 的 //go:embed all:frontend/dist
#    要求编译主包时 dist 目录必须存在（缺失时 generate module 的 bindings 构建、go build/vet/test
#    均报 "pattern all:frontend/dist: no matching files found"），且主包冒烟测试
#    TestServeCookie_AssetCascadeSmoke 还要求 embed 中存在 assets/*.js 产物，故测试前先预置
#    含 assets/app.js 的 dist 占位，后续「前端构建」步骤会整体清空重建真实产物。
# 2. 不带构建标签时 wails 桌面前端不进编译依赖图（internal/app 走桩实现），后端测试无需
#    GTK/WebKit；「后端编译验证」步骤显式带 production 标签走真实桌面编译路径（对齐 wails
#    build 的 -tags desktop,production）。Wails v2.16 默认 pkg-config 依赖 webkit2gtk-4.0，
#    而 Ubuntu 24.04（ubuntu-latest）仓库已移除 4.0，须叠加 webkit2_41 标签切换到
#    webkit2gtk-4.1（对应 apt 安装的 libwebkit2gtk-4.1-dev）。
name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 2. 预置 frontend/dist 占位：满足 main.go //go:embed 对 dist 目录存在性的要求，
      #    assets/app.js 供冒烟测试 TestServeCookie_AssetCascadeSmoke 的 "assets/*.js"
      #    产物断言（见文件头前置事实 1）。占位内容无业务语义，后续「前端构建」步骤
      #    经 vite 默认 emptyOutDir 整体清空重建。
      - name: 预置前端 dist 占位
        run: |
          mkdir -p frontend/dist/assets
          echo '<!doctype html><title>ci placeholder</title>' > frontend/dist/index.html
          echo '/* ci placeholder */' > frontend/dist/assets/app.js

      # 3. 安装 Go 1.26（对齐 release.yml 与 go.mod toolchain go1.26.6；setup-go 默认缓存 go module/build）
      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      # 4. 安装 Node.js 20（带 npm cache 加速，对齐 release.yml）
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # 5. apt 包缓存（G6）：缓存 /var/cache/apt/archives 的 .deb，命中时 apt-get install
      #    跳过下载（GTK/webkit 依赖链数百 MB，省 30-90 秒/run）。
      #    缓存方案评估结论：选 actions/cache@v4（GitHub 官方维护、社区使用最广、无第三方
      #    信任面），未选 awalsh128/cache-apt-pkgs-action（第三方维护节奏慢、自带独立安装
      #    逻辑出问题 debug 成本高）。污染风险低：apt 安装自带包完整性校验，缓存内容损坏
      #    只会导致重新下载、不会装坏包。key 含包列表文件 hash（.github/ci-apt-packages.txt
      #    单一数据源，包列表变更即自动换 key 重装）。release.yml 不加：发版 job 低频 +
      #    ubuntu:22.04 容器跑 action 需 GitHub 注入 node runtime（兼容性多一层不确定），
      #    收益/风险比不划算。security job 不装 GTK 依赖，无需缓存。
      - name: 缓存 apt 包
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/ci-apt-packages.txt') }}

      # 6. 安装 Wails Linux 桌面编译依赖：gcc/pkg-config 支撑 cgo 构建，libgtk-3-dev /
      #    libwebkit2gtk-4.1-dev 提供对应 pkg-config 包，仅「后端编译验证」的 production
      #    桌面路径消费（Ubuntu 24.04 无 webkit2gtk-4.0，统一走 4.1 + webkit2_41 标签）。
      #    包名从 .github/ci-apt-packages.txt 读取（与缓存 key 同一数据源，防两处漂移）。
      #    xargs 无注释语法（# 会被当包名传给 apt-get），故先 grep 过滤 # 注释行；
      #    -r 防全注释/空文件时以零参数调用 apt-get install（报错退出）
      - name: 安装 Wails Linux 桌面编译依赖
        run: |
          sudo apt-get update
          grep -v '^#' .github/ci-apt-packages.txt | xargs -r sudo apt-get install -y

      # 7. 安装 Wails CLI（锁定 v2 大版本）
      - name: 安装 Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2

      # 8. 生成 Wails 绑定（frontend/wailsjs/ 被 gitignore，须重新生成；generate module 以
      #    bindings 标签编译主包产出 JS/TS 绑定，bindings 标签下桌面前端不进依赖图，
      #    无需 GTK/WebKit，仅依赖 dist 占位满足 embed）
      - name: 生成 Wails 绑定
        run: wails generate module

      # 9. 后端编译验证：带 production 标签走真实 Linux 桌面编译路径（对齐 wails build 的
      #    -tags desktop,production），验证 Linux 平台差异代码（pty/剪贴板/文件打开/
      #    自更新 .sh 等）与 cgo 链接完整可用
      - name: 后端编译验证（Linux 桌面生产路径）
        run: go build -tags "desktop,production,webkit2_41" ./...

      # 10. 后端静态检查（无标签依赖图与单元测试一致，不含 cgo 桌面前端；不加
      #    -unsafeptr=false：该豁免针对 windows 专属的 util/clipboard_windows.go 误报，
      #    Linux 编译图不含该文件，与本地 GOOS=linux go vet 验证一致）
      - name: 后端静态检查
        run: go vet ./...

      # 11. 后端单元测试（快的放前面，失败即停）
      - name: 后端单元测试
        run: go test ./...

      # 12. 后端集成测试（临时 git 仓库 fixture，git_flows_integration_test.go，
      #     构建标签 integration 隔离，不依赖网络）
      - name: 后端集成测试
        run: go test -tags=integration ./...

      # 13. 前端依赖安装
      - name: 安装前端依赖
        run: cd frontend && npm ci

      # 14. 前端构建（清空占位 dist 生成真实产物，验证绑定完整 + MISSING_EXPORT 类打包错误）
      - name: 前端构建
        run: cd frontend && npm run build

      # 15. 安装 Playwright Chromium（--with-deps 同步装系统依赖，runner 有免密 sudo）
      - name: 安装 Playwright 浏览器
        run: cd frontend && npx playwright install --with-deps chromium

      # 16. E2E 测试（webServer 自动 vite build + vite preview，CI 环境自动 retries=2）
      - name: E2E 测试
        run: cd frontend && npm run e2e

      # 17. 前端单元测试
      - name: 前端单元测试
        run: cd frontend && npm test -- --run

      # 18. 失败时上传 E2E 报告与 trace（短保留期）
      - name: 上传 E2E 报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  # 安全扫描 job：与 test job 并行，govulncheck + npm audit 采集漏洞。
  # continue-on-error：发现 high 漏洞时标记 job 失败但不阻塞 PR 合并（信息性扫描）。
  # 已知无补丁漏洞（如 xlsx）见 docs/spec/security-scan.md「已知接受风险」章节。
  security:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # frontend/dist/ 不入库：govulncheck 加载主包须满足 //go:embed 的目录存在性，占位即可
      # （与 test job 占位步骤保持同一 run 块，便于同步维护）
      - name: 预置前端 dist 占位
        run: |
          mkdir -p frontend/dist/assets
          echo '<!doctype html><title>ci placeholder</title>' > frontend/dist/index.html
          echo '/* ci placeholder */' > frontend/dist/assets/app.js

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Go 漏洞扫描：govulncheck 基于代码实际调用链分析已知漏洞（非全依赖树扫描），
      # 只报代码可达的漏洞，噪声低。go.mod toolchain go1.26.6 确保标准库漏洞已修复。
      - name: 安装 govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Go 漏洞扫描
        run: govulncheck ./...

      # 前端依赖安装（npm audit 需读取 package-lock.json 依赖树）
      - name: 安装前端依赖
        run: cd frontend && npm ci

      # npm 漏洞扫描：本地 npmmirror registry 不支持安全端点，须显式指定官方 registry。
      # --audit-level=high：仅 high 以上漏洞才使步骤失败，避免 low/moderate 噪声阻塞。
      - name: 前端漏洞扫描
        run: cd frontend && npm audit --registry=https://registry.npmjs.org --audit-level=high
